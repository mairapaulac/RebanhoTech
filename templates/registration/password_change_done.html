{% extends "base.html" %}

{% block title %}Senha Alterada - RebanhoTech{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle mb-3" style="width: 72px; height: 72px;">
                    <i class="bi bi-shield-check fs-1"></i>
                </div>
                <h3 class="fw-bold mb-3">Senha Atualizada!</h3>
                <p class="text-muted">
                    Sua senha foi alterada com sucesso.
                </p>
                <div class="mt-4">
                    <a href="{% url 'dashboard' %}" class="btn btn-success">
                        <i class="bi bi-speedometer2 me-1"></i> Voltar ao Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
