{% extends "base.html" %}

{% block title %}Senha Redefinida com Sucesso - RebanhoTech{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle mb-3" style="width: 72px; height: 72px;">
                    <i class="bi bi-check-circle-fill fs-1"></i>
                </div>
                <h3 class="fw-bold mb-3">Senha Redefinida!</h3>
                <p class="text-muted">
                    Sua nova senha foi salva com sucesso. Você já pode fazer login na sua conta.
                </p>
                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-success btn-lg">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar Agora
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
