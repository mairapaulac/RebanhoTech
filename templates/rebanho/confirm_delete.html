{% extends "base.html" %}

{% block title %}Confirmar Exclusão - RebanhoTech{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white py-3">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar Exclusão</h5>
            </div>
            <div class="card-body p-4 text-center">
                <i class="bi bi-trash text-danger display-4 d-block mb-3"></i>
                <h5 class="fw-bold mb-3">Tem certeza de que deseja excluir:</h5>
                <p class="text-dark fw-semibold bg-light p-3 rounded border">{{ objeto }}</p>
                <p class="text-muted small">Esta ação não poderá ser revertida.</p>

                <form method="post" class="mt-4 d-flex justify-content-center gap-3">
                    {% csrf_token %}
                    <a href="{% url cancel_url %}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash me-1"></i> Excluir Registro
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
